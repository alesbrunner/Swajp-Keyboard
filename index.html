<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swajp – Anax Keyboard</title>
<script>
(function(){var l="en";try{var s=localStorage.getItem("lang");if(s==="cs"||s==="en")l=s;else{var a=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""];for(var i=0;i<a.length;i++){if(/^(cs|sk)/i.test(a[i])){l="cs";break}}}}catch(e){}location.replace(l+"/")})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
<style>
html,body{margin:0;height:100%;background:#0B0C0E;color:#E8EAED;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;box-sizing:border-box;text-align:center}
h1{margin:0;font-size:28px;font-weight:700}
p{margin:0;color:#9AA0A6}
.b{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a{display:inline-block;min-width:140px;padding:12px 20px;border:1px solid rgba(255,255,255,.33);border-radius:12px;background:#353A40;color:#fff;text-decoration:none;font-size:16px}
a:hover{border-color:#7FD1AE}
</style></head>
<body><main>
<h1>Swajp – Anax Keyboard</h1>
<p>Vyberte jazyk · Choose language</p>
<div class="b"><a href="cs/" onclick="try{localStorage.setItem('lang','cs')}catch(e){}">Česky</a><a href="en/" onclick="try{localStorage.setItem('lang','en')}catch(e){}">English</a></div>
</main></body></html>
